<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Welcome To Rock-Paper-Scissors Game</h1>
        <div class="choices">
            <div class="choice" id="rock" style="--accent-color:#f781a1">
                <img src="./rock.png">
            </div>
            <div class="choice" id="paper" style="--accent-color:#bf8bd7">
                <img src="./paper.png">
            </div>
            <div class="choice" id="scissor" style="--accent-color:#82abf8">   
                <img src="./scissors.png">
            </div>
        </div>
        <div class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>You:🙎🏻‍♀️</p>
            </div>
            <div class="score">
                <p id="computer-score">0</p>
                <p>Computer:🖥️</p>
            </div>
        </div>
        <div class="msg-container">
            <p id="msg">Play your move 👈🏻</p>
        </div>
        <audio src="click.wav" preload="auto"></audio>
        <audio src="win.wav" preload="auto"></audio>
        <audio src="lose.wav" preload="auto"></audio>
        <audio src="rock.wav" preload="auto"></audio>
        <audio src="paper.wav" preload="auto"></audio>
        <audio src="scissors.wav" preload="auto"></audio>
        <script src="script.js"></script>
    </body>
</html>
