<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic-Tac-Toe Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="msg-container hide">
            <p id="msg">Winner</p>
            <img id="img" src="https://i.pinimg.com/originals/75/9f/05/759f0557cbb379070510c9af2b9b0acf.gif" alt>
            <img id="img1" src="https://www.gifcen.com/wp-content/uploads/2022/09/fireworks-gif.gif" alt>        
            <audio id="winSound" src="win.mp3" preload="autoplay"></audio>
            <audio id="clickSound" src="click-pop.wav" preload="auto"></audio>
            <audio id="clickSound1" src="click-soft.wav" preload="auto"></audio>
            <button id="newBtn">New Game</button>
        </div>
        <main>
            <h1>Welcome To Tic-Tac-Toe Game</h1>
            <div class="container">
                <div class="Game">
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                </div>
            </div>
            <button id="reset">Reset Game</button>
        </main>  
        <script src="script.js"></script>
    </body>
</html>
